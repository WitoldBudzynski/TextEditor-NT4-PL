<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextEditor NT4 PL</title>
  <style>
    body { 
      font-family: sans-serif; 
      margin: 0; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      min-height: 90vh; 
      background-color: #f4f5f7; 
      color: #333; 
      box-sizing: border-box;
    }
    .header { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #ccc; }
    h1 { margin: 0; color: #2c3e50; }
    .description { background-color: #fff; padding: 15px; border-radius: 4px; border: 1px solid #ddd; margin-bottom: 20px; line-height: 1.5; }
    #status { font-style: italic; font-size: 14px; margin-top: 10px; color: #555; }
    #app_interface { display: flex; flex-direction: column; flex-grow: 1; }
    #text_editor { flex-grow: 1; margin: 10px 0; font-family: monospace; font-size: 14px; padding: 15px; border: 1px solid #ccc; border-radius: 4px; resize: none; min-height: 300px; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; margin-bottom: 5px; max-width: 300px;}
    #authorize_btn { background-color: #4285F4; color: white; display: none; }
    #save_btn { background-color: #0F9D58; color: white; display: none; align-self: flex-start; }
    #create_test_btn { background-color: #F4B400; color: white; display: none; }
    
    /* Styl dla stopki (footer) */
    footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #666;
    }
    footer .footer-links a {
      color: #4285F4;
      text-decoration: none;
      margin-left: 20px;
    }
    footer .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
</head>
<body>

  <div class="header">
    <h1>TextEditor NT4 PL</h1>
    <div id="status">Initializing the application...</div>
  </div>

  <div class="description" id="app_description">
    <strong>About the application:</strong> TextEditor NT4 PL is a free, browser-based tool designed for simple and quick editing of text files (e.g. .txt, .json) directly from your Google Drive.
  </div>
  
  <button id="authorize_btn" class="btn">Sign in with Google to use the editor</button>
  <button id="create_test_btn" class="btn">Enable Drive integration (Test file)</button>
  
  <div id="app_interface">
    <textarea id="text_editor" style="display: none;" spellcheck="false"></textarea>
    <button id="save_btn" class="btn">Save to Drive</button>
  </div>

  <footer>
    <div>&copy; 2026 TextEditor</div>
    <div class="footer-links">
      <a href="https://nt4.pl">nt4.pl</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="terms.html">Terms of Service</a>
    </div>
  </footer>

  <script>
    const CLIENT_ID = '422149545173-i34mnoatimakepct09vnl73pje63iq9f.apps.googleusercontent.com'; 
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    
    let tokenClient;
    let accessToken = null;
    let fileId = null;

    const authorizeBtn = document.getElementById('authorize_btn');
    const saveBtn = document.getElementById('save_btn');
    const createTestBtn = document.getElementById('create_test_btn');
    const editor = document.getElementById('text_editor');
    const statusEl = document.getElementById('status');
    const descEl = document.getElementById('app_description');

    const urlParams = new URLSearchParams(window.location.search);
    const stateParam = urlParams.get('state');
    
    if (stateParam) {
      try {
        const state = JSON.parse(stateParam);
        if (state.action === 'open') {
          fileId = state.ids[0];
          statusEl.textContent = 'File found on Drive.';
        }
      } catch (e) {
        statusEl.textContent = 'Unable to read the Drive link.';
      }
    } else {
      statusEl.textContent = 'The application is ready. Open it from Google Drive or sign in.';
    }

    function gisLoaded() {
      if (!CLIENT_ID) {
        statusEl.textContent = 'Configuration error: CLIENT_ID is missing.';
        return;
      }
      
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error) {
            statusEl.textContent = 'Access denied.';
            return;
          }
          accessToken = resp.access_token;
          
          localStorage.setItem('drive_token', accessToken);
          localStorage.setItem('drive_token_expires', Date.now() + 55 * 60 * 1000);
          
          showEditor();
        },
      });

      checkSession();
    }

    function checkSession() {
      const savedToken = localStorage.getItem('drive_token');
      const tokenExpires = localStorage.getItem('drive_token_expires');

      if (savedToken && tokenExpires && Date.now() < parseInt(tokenExpires)) {
        accessToken = savedToken;
        showEditor();
      } else {
        authorizeBtn.style.display = 'block';
        statusEl.textContent += ' Sign-in required.';
      }
    }

    function showEditor() {
      authorizeBtn.style.display = 'none';
      descEl.style.display = 'none';
      
      if (fileId) {
        editor.style.display = 'block';
        saveBtn.style.display = 'block';
        loadFile();
      } else {
        createTestBtn.style.display = 'block';
        statusEl.textContent = 'Signed in successfully. (Session active)';
      }
    }

    function loadFile() {
      statusEl.textContent = 'Loading content...';
      fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      })
      .then(response => {
        if (response.status === 401) throw new Error('Token expired');
        if (!response.ok) throw new Error('Unable to download the file');
        return response.text();
      })
      .then(text => {
        editor.value = text;
        statusEl.textContent = 'Ready to edit.';
      })
      .catch(error => {
        if (error.message === 'Token expired') {
          localStorage.removeItem('drive_token');
          localStorage.removeItem('drive_token_expires');
          statusEl.textContent = 'Your session has expired. Please sign in again.';
          editor.style.display = 'none';
          saveBtn.style.display = 'none';
          authorizeBtn.style.display = 'block';
        } else {
          statusEl.textContent = 'An error occurred while downloading the file.';
        }
      });
    }

    function saveFile() {
      statusEl.textContent = 'Saving...';
      fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'text/plain' 
        },
        body: editor.value
      })
      .then(response => {
        if (response.status === 401) throw new Error('Token expired');
        if (!response.ok) throw new Error('Save error');
        return response.json();
      })
      .then(data => {
        statusEl.textContent = 'Changes saved successfully to Google Drive!';
        setTimeout(() => statusEl.textContent = 'Ready to edit.', 3000);
      })
      .catch(error => {
        statusEl.textContent = 'Save failed.';
      });
    }
    
    function createTestFile() {
      statusEl.textContent = 'Creating a test file...';
      fetch('https://www.googleapis.com/drive/v3/files', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          name: 'Notepad_Installation_Test.txt',
          mimeType: 'text/plain'
        })
      })
      .then(resp => {
        if (!resp.ok) throw new Error('File creation error');
        return resp.json();
      })
      .then(data => {
        statusEl.textContent = 'File created! Refresh Google Drive. The application should appear in the "Open with" menu.';
        createTestBtn.style.display = 'none';
      })
      .catch(err => {
        console.error(err);
        statusEl.textContent = 'An error occurred while creating the file.';
      });
    }

    authorizeBtn.onclick = () => tokenClient.requestAccessToken();
    saveBtn.onclick = saveFile;
    createTestBtn.onclick = createTestFile;
  </script>
</body>
</html>
