<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drive Notepad</title>
  <style>
    body { font-family: sans-serif; margin: 20px; display: flex; flex-direction: column; height: 90vh; background-color: #f4f5f7; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h2 { margin: 0; color: #333; }
    #status { color: #555; font-style: italic; font-size: 14px; }
    #text_editor { flex-grow: 1; margin: 10px 0; font-family: monospace; font-size: 14px; padding: 15px; border: 1px solid #ccc; border-radius: 4px; resize: none; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
    #authorize_btn { background-color: #4285F4; color: white; display: none; align-self: flex-start; }
    #save_btn { background-color: #0F9D58; color: white; display: none; align-self: flex-start; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
</head>
<body>

  <div class="header">
    <h2>Notatnik Drive</h2>
    <div id="status">Sprawdzanie linku z Google Drive...</div>
  </div>
  
  <button id="authorize_btn" class="btn">Połącz z kontem Google, aby edytować</button>
  <textarea id="text_editor" style="display: none;" spellcheck="false"></textarea>
  <button id="save_btn" class="btn">Zapisz na Dysku</button>

  <script>
    // ---------------------------------------------------------
    // UWAGA: WKLEJ TUTAJ SWÓJ CLIENT_ID Z GOOGLE CLOUD CONSOLE
    // ---------------------------------------------------------
    const CLIENT_ID = '422149545173-i34mnoatimakepct09vnl73pje63iq9f.apps.googleusercontent.com'; 
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    
    let tokenClient;
    let accessToken = null;
    let fileId = null;

    const authorizeBtn = document.getElementById('authorize_btn');
    const saveBtn = document.getElementById('save_btn');
    const editor = document.getElementById('text_editor');
    const statusEl = document.getElementById('status');

    // 1. Pobranie ID pliku z URL
    const urlParams = new URLSearchParams(window.location.search);
    const stateParam = urlParams.get('state');
    
    if (stateParam) {
      try {
        const state = JSON.parse(stateParam);
        if (state.action === 'open') {
          fileId = state.ids[0];
          statusEl.textContent = 'Znaleziono plik. Wymagane logowanie.';
        }
      } catch (e) {
        console.error("Błąd parsowania parametru state", e);
        statusEl.textContent = 'Błąd odczytu linku z Drive.';
      }
    } else {
      statusEl.textContent = 'Aplikację należy otwierać bezpośrednio z menu Dysku Google.';
    }

    // 2. Inicjalizacja Google Identity Services (GIS)
    function gisLoaded() {
      if (!CLIENT_ID || CLIENT_ID.includes('TUTAJ_WKLEJ')) {
        statusEl.textContent = 'Brak skonfigurowanego CLIENT_ID w kodzie!';
        return;
      }

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (resp) => {
          if (resp.error) {
            statusEl.textContent = 'Odmowa dostępu.';
            return;
          }
          accessToken = resp.access_token;
          authorizeBtn.style.display = 'none';
          editor.style.display = 'block';
          saveBtn.style.display = 'block';
          
          if (fileId) loadFile();
        },
      });
      
      if (fileId) {
        authorizeBtn.style.display = 'block';
      }
    }

    // 3. Pobranie pliku z Drive
    function loadFile() {
      statusEl.textContent = 'Pobieranie zawartości...';
      fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: { 'Authorization': `Bearer ${accessToken}` }
      })
      .then(response => {
        if (!response.ok) throw new Error('Nie udało się pobrać pliku');
        return response.text();
      })
      .then(text => {
        editor.value = text;
        statusEl.textContent = 'Gotowy do edycji.';
      })
      .catch(error => {
        console.error(error);
        statusEl.textContent = 'Błąd podczas pobierania pliku z Drive.';
      });
    }

    // 4. Zapis zmian na Drive
    function saveFile() {
      statusEl.textContent = 'Trwa zapisywanie...';
      const content = editor.value;
      
      // Prosty tekst / JSON można wysłać za pomocą uploadu typu 'media' jako PATCH
      fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {
          'Authorization': `Bearer ${accessToken}`,
          'Content-Type': 'text/plain' 
        },
        body: content
      })
      .then(response => {
        if (!response.ok) throw new Error('Błąd zapisu');
        return response.json();
      })
      .then(data => {
        statusEl.textContent = 'Zmiany zapisane pomyślnie!';
        setTimeout(() => statusEl.textContent = 'Gotowy do edycji.', 3000);
      })
      .catch(error => {
        console.error(error);
        statusEl.textContent = 'Zapis nie powiódł się.';
      });
    }

    authorizeBtn.onclick = () => tokenClient.requestAccessToken({prompt: 'consent'});
    saveBtn.onclick = saveFile;
  </script>
</body>
</html>
